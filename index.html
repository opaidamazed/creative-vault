<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creative Vault | المكتبة الذكية للمؤثرات الصوتية</title>
  <meta name="description" content="مكان ثابت لتحميل ملحقات وموارد التصميم والمونتاج: مؤثرات صوتية وموسيقى ومكتبة كاملة.">
  <meta name="theme-color" content="#14062e">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="home">

<div id="siteHeader"></div>

<main>

<!-- ===================== Hero Slider ===================== -->
<section class="hero" aria-label="البنرات">
  <div class="slider" id="slider">
    <div class="slides" id="slides"></div>
    <button class="arrow prev" id="prevBtn" aria-label="السابق"><svg class="i"><use href="#i-chev-r"/></svg></button>
    <button class="arrow next" id="nextBtn" aria-label="التالي"><svg class="i"><use href="#i-chev-l"/></svg></button>
    <a href="#libraries" class="btn btn-green hero-cta"><svg class="i"><use href="#i-down"/></svg>استكشف المكتبة</a>
    <div class="dots" id="dots"></div>
  </div>
</section>

<!-- ===================== Libraries ===================== -->
<section class="section" id="libraries">
  <div class="container">
    <div class="eyebrow"><span>مكتبتنا المميزة</span></div>
    <h2 class="section-title">اختر ما تحتاجه من مكتبات الملحقات</h2>
    <div class="lib-grid" id="libGrid"></div>
    <p class="size-note" id="sizeNote"></p>
  </div>
</section>

<!-- ===================== Latest (بيتخفى لو مفيش إضافات) ===================== -->
<section class="section" id="latest" hidden>
  <div class="container">
    <div class="section-head">
      <h2 class="line-title"><span>أحدث <b>الإضافات</b></span></h2>
      <a href="library" class="view-all">عرض الكل <svg class="i"><use href="#i-chev-l"/></svg></a>
    </div>
    <div class="carousel-wrap">
      <button class="c-arrow c-prev" id="cPrev" aria-label="السابق"><svg class="i"><use href="#i-chev-r"/></svg></button>
      <div class="carousel" id="latestList" tabindex="0"></div>
      <button class="c-arrow c-next" id="cNext" aria-label="التالي"><svg class="i"><use href="#i-chev-l"/></svg></button>
    </div>
  </div>
</section>

<div class="container"><p class="empty" id="noResults" hidden>مفيش نتائج مطابقة للبحث.</p></div>

<!-- ===================== Why ===================== -->
<section class="section" id="why">
  <div class="container">
    <h2 class="line-title"><span>لماذا <b class="en">Creative Vault</b> ؟</span></h2>
    <div class="features" id="features"></div>
  </div>
</section>

<!-- ===================== About banner ===================== -->
<section class="section about" id="about">
  <div class="container">
    <div class="about-banner">
      <img id="aboutImg" src="assets/about-banner.webp" alt="عن Creative Vault — Designed with love by Obaida" loading="lazy">
      <a href="about" id="aboutMore" class="hit hit-more" aria-label="تعرف على المزيد"></a>
      <a href="#" data-social="youtube"   class="hit hit-yt" aria-label="يوتيوب"></a>
      <a href="#" data-social="facebook"  class="hit hit-fb" aria-label="فيسبوك"></a>
      <a href="#" data-social="instagram" class="hit hit-ig" aria-label="انستجرام"></a>
      <a href="#" data-social="telegram"  class="hit hit-tg" aria-label="تليجرام"></a>
    </div>
  </div>
</section>

</main>

<div id="siteFooter"></div>

<script src="js/config.js"></script>
<script src="js/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/app.js"></script>
</body>
</html>
